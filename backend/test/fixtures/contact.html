<!doctype html><html><head><meta charset="utf-8"><title>Contact Fixture Company</title></head><body><main><h1>Contact us</h1><form id="contact-form"><label>Full name <input id="full-name" name="contactPerson" required></label><label>Email address <input id="email" name="email" type="email" required></label><label>Your message <textarea id="message" name="message" required></textarea></label><button id="send" type="submit">Send enquiry</button></form></main><script>document.querySelector('form').addEventListener('submit',(event)=>{event.preventDefault();event.target.outerHTML='<div role="status"><h2>Thank you</h2><p>Your message has been sent.</p></div>';});</script></body></html>
