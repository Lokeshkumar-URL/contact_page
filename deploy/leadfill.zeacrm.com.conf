# Install this file in /etc/nginx/sites-available/leadfill.zeacrm.com on the
# Docker host, then enable it from /etc/nginx/sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name leadfill.zeacrm.com;

    location / {
        proxy_pass http://127.0.0.1:7878;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for long-running live-progress event streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
